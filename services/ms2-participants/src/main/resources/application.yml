server:
  port: 8082

spring:
  application:
    name: ms2-participants
  datasource:
    url: jdbc:h2:mem:ms2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/enlice}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/enlice/protocol/openid-connect/certs}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:enlice}
    password: ${SPRING_RABBITMQ_PASSWORD:enlice}
  cloud:
    function:
      definition: onChallengePublished;onApplicationRegistered;onVerificationCompleted;onSubmissionRejected;onJudgingCompleted;onWinnersDeclared
    stream:
      default-binder: rabbit
      default:
        content-type: application/json
        consumer:
          max-attempts: 3
      bindings:
        onChallengePublished-in-0:
          destination: challenge.published
          group: ms2-participants
        onApplicationRegistered-in-0:
          destination: application.registered
          group: ms2-participants
        onVerificationCompleted-in-0:
          destination: verification.completed
          group: ms2-participants
        onSubmissionRejected-in-0:
          destination: submission.rejected
          group: ms2-participants
        onJudgingCompleted-in-0:
          destination: judging.completed
          group: ms2-participants
        onWinnersDeclared-in-0:
          destination: winners.declared
          group: ms2-participants
    rabbit:
      default:
        consumer:
          auto-bind-dlq: true
          republish-to-dlq: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

enlice:
  seed:
    enabled: ${ENLICE_SEED_ENABLED:true}
