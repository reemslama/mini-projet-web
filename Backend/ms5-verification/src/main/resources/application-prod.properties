# Profil production : base dédiée, migrations Flyway, JWT local, enrichissement MS3.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ms5_verification}
spring.datasource.username=${DB_USER:ms5}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.health.rabbit.enabled=true

ms5.security.enabled=true
ms5.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/arene/protocol/openid-connect/certs}
ms5.enrichment.mode=feign
ms5.public-base-url=${MS5_PUBLIC_BASE_URL:http://localhost:8080}

# Le runner Docker épinglé remplace le fixture en S7 ; garder la même interface SandboxPort.
