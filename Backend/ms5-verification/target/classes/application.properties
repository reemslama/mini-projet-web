spring.application.name=ms5-verification
server.port=8085

# Eureka — service enregistré sous ms5-verification (port réservé au contrat gelé)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Deux instances (8085 / 8095) doivent avoir des identifiants distincts.
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# Documentation OpenAPI générée (le contrat dans contracts/ reste la source de vérité)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator — cohérent avec les autres services backend
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Le broker Rabbit n'est pas démarré en local (S5) : ne pas faire échouer /actuator/health.
management.health.rabbit.enabled=false
management.info.env.enabled=true
info.app.name=MS5-Verification
info.app.version=1.0.0
info.app.description=Bac a sable, verdict deterministe, similarite et IA d'appoint

# Développement local : H2 en mémoire, schéma JPA dérivé de l'entité
spring.datasource.url=jdbc:h2:mem:ms5_verification;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Sécurité : mode ouvert uniquement en local ; production = JWT Keycloak (profil prod)
ms5.security.enabled=false

# Intégrations : stub local jusqu'au branchement Feign MS1/MS3 (S6)
ms3.url=http://localhost:8083
ms1.url=http://localhost:8081
ms5.enrichment.mode=stub

# Bac à sable déterministe : le runner Docker durci est branché en S7
ms5.sandbox.mode=fixture
ms5.sandbox.image=local-fixture@sha256:ms5-dev
ms5.sandbox.workers=2
ms5.worker.poll-ms=1000
ms5.worker.initial-delay-ms=2000

# Similarité local, versionné, seuil calibré (ADR-008)
ms5.similarity.embedder=local-hash
ms5.similarity.dim=384
ms5.similarity.model-version=local-code-minilm-v1.0.0-384d
ms5.similarity.threshold=0.85
ms5.similarity.top-k=10

# IA strictement optionnelle : 503 rapide quand désactivée
ms5.ai.enabled=false

# Outbox : DB d'abord, broker ensuite
ms5.outbox.poll-ms=500
ms5.outbox.batch=100
ms5.public-base-url=http://localhost:8080
