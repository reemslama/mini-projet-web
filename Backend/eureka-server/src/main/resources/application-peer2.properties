# Eureka peer2 : http://127.0.0.1:8762
# Lancement : --spring.profiles.active=peer2
server.port=8762
# Hostname différent de peer1 (localhost) pour que la réplication ait lieu.
eureka.instance.hostname=127.0.0.1
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Réplication : peer2 s'enregistre auprès de peer1 et récupère son registre.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000
