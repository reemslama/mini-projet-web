# Eureka peer1 : http://localhost:8761
# Lancement : --spring.profiles.active=peer1
server.port=8761
# Hostname différent de peer2 (127.0.0.1) : sinon Eureka considère que le pair
# est lui-même et ne réplique rien.
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Réplication : peer1 s'enregistre auprès de peer2 et récupère son registre.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://127.0.0.1:8762/eureka/

# Dev : retirer vite les instances arrêtées, pas de bandeau rouge "EMERGENCY"
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000
