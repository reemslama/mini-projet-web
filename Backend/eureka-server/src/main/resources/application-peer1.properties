# Eureka - instance 1 : http://localhost:8761
# Lancement : --spring.profiles.active=peer1  (IntelliJ : Active profiles = peer1)
#
# Deux peers sur la meme machine doivent avoir des hostnames DIFFERENTS,
# sinon Eureka les prend pour le meme noeud (unavailable-replicas).
# Astuce sans modifier le fichier hosts : peer1 = localhost, peer2 = 127.0.0.1
server.port=8761
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# En mode cluster, chaque peer s'enregistre et replique le registre de l'autre
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://127.0.0.1:8762/eureka/

# Dev : retirer vite les instances arretees, pas de bandeau rouge "EMERGENCY"
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000
