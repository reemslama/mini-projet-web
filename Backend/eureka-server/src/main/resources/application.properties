spring.application.name=eureka-server
server.port=8761

eureka.instance.hostname=eureka1

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://eureka2:8762/eureka/

# Actuator - supervision du serveur de decouverte
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Eureka-Server
info.app.version=1.0.0
info.app.description=Serveur de decouverte Eureka de la plateforme Arene