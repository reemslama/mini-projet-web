# ------------------------------------------------------------------
# MS2 · Participants
# 2e instance : -Dserver.port=8092  (ou --server.port=8092)
# ------------------------------------------------------------------
spring.application.name=participants
server.port=8082

# ----------
spring.datasource.url=jdbc:mysql://localhost:3306/participantsdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# ---------- Eureka : on déclare LES DEUX serveurs
# Le client s'enregistre sur le 1er ; Eureka réplique vers le 2e.
# Si le 1er tombe, le client bascule automatiquement sur le 2e.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://127.0.0.1:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Identifiant unique par instance -> 2 lignes distinctes dans le dashboard
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Heartbeat plus rapide en dev (défaut : 30 s / 90 s)
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ---------- Actuator (atelier Observabilité)
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,beans,mappings
management.endpoint.health.show-details=always
# Eureka reçoit le vrai statut de /health (UP / DOWN)
eureka.client.healthcheck.enabled=true
management.info.env.enabled=true
info.app.name=participants
info.app.version=1.0.0
info.app.description=MS2 - Gestion des utilisateurs (developpeurs), des equipes et des candidatures aux defis
info.app.team=Arene
info.app.port=${server.port}

# ---------- Swagger
springdoc.swagger-ui.path=/swagger-ui.html
