# ------------------------------------------------------------------
# Configuration commune aux deux instances Eureka (peer1 et peer2)
# Lancer avec le profil peer1 (port 8761) ou peer2 (port 8762).
# Sans profil : un seul serveur autonome sur 8761 (comme dans l'atelier).
# ------------------------------------------------------------------
spring.application.name=eureka-server
server.port=8761

# Mode autonome par défaut (aucun profil actif)
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# En développement : retirer vite les instances arrêtées du dashboard
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

# Observabilité du serveur lui-même
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=eureka-server
info.app.description=Annuaire de services de la plateforme Arène
