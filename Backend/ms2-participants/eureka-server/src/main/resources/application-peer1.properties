# ------------------------------------------------------------------
# Eureka n°1 : http://localhost:8761
# Il s'enregistre auprès de son pair (peer2) pour répliquer le registre.
#
# IMPORTANT : les deux pairs doivent avoir des noms d'hôte DIFFÉRENTS,
# sinon Eureka croit que le pair, c'est lui-même, et ne réplique rien.
# On utilise donc "localhost" pour peer1 et "127.0.0.1" pour peer2
# (aucune modification du fichier hosts nécessaire).
# ------------------------------------------------------------------
server.port=8761
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://127.0.0.1:8762/eureka/
info.app.instance=peer1
