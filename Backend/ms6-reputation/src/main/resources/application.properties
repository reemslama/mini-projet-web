spring.application.name=ms6-reputation
server.port=8086
# 2e instance : --server.port=8096 (IntelliJ : VM option -Dserver.port=8096)

# H2 en memoire (base dediee a MS6, chaque instance a ses propres donnees)
spring.datasource.url=jdbc:h2:mem:ms6_reputation;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka : enregistrement aupres des DEUX serveurs (peer1 8761 + peer2 8762)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://127.0.0.1:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Propagation de l'etat /actuator/health vers le registre Eureka
eureka.client.healthcheck.enabled=true

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator - supervision
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=MS6-Reputation
info.app.version=1.0.0
info.app.description=Microservice de reputation : profils, badges, classements
info.app.team=Arene
info.app.owner=Jihed Ramedi

# Messages d'erreur lisibles (404 / 409)
server.error.include-message=always
