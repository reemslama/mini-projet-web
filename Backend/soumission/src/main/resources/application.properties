spring.application.name=ms3-soumissions
server.port=8083

# Eureka — découverte côté client (annuaire local, voir chapitre 4)
# En Docker, remplacer localhost par le nom d'hôte du serveur Eureka (ex. eureka1)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Identité et cycle de vie de l'instance dans le registre
# Deux instances (8083 / 8093) doivent avoir des identifiants distincts.
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Swagger / OpenAPI (documentation interactive des 6 endpoints MS3)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator - supervision (health, info, metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=MS3-Soumissions
info.app.version=1.0.0
info.app.description=Microservice de gestion des soumissions

# Propagation de l'etat de sante au registre Eureka
eureka.client.healthcheck.enabled=true
