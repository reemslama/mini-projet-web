# ------------------------------------------------------------------
# Arène API Gateway — configuration dynamique (Eureka)
# Port 8080 par convention projet ; GATEWAY_PORT permet de tester ailleurs
# (utile quand Jenkins occupe déjà 8080 sur une machine de développement).
# ------------------------------------------------------------------
spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8080}

# Découverte : la Gateway s'enregistre et interroge les deux pairs Eureka.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# ------------------------------------------------------------------
# Routes dynamiques : lb://<serviceId> + StripPrefix pour transformer
# /msN/<chemin du service> en <chemin du service> chez le microservice.
# Le même prefixe sert aussi aux specs OpenAPI (/msN/v3/api-docs).
# ------------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[0].id=ms1-challenges
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms1-challenges
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/ms1/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=participants
spring.cloud.gateway.server.webflux.routes[1].uri=lb://participants
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/ms2/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=ms3-soumissions
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms3-soumissions
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/ms3/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=ms4-evaluation
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms4-evaluation
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ms4/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=ms5-verification
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ms5-verification
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/ms5/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=ms6-reputation
spring.cloud.gateway.server.webflux.routes[5].uri=lb://ms6-reputation
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/ms6/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1
# Circuit breaker démontré sur MS6 : si le service est arrêté, la route bascule sur /fallback/ms.
spring.cloud.gateway.server.webflux.routes[5].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[5].filters[1].args.name=ms6CircuitBreaker
spring.cloud.gateway.server.webflux.routes[5].filters[1].args.fallbackUri=forward:/fallback/ms

# Deuxième algorithme (ni Round Robin ni Random) appliqué à MS1 uniquement.
gateway.lb.hash.header=X-Route-Key

# Réglages volontairement rapides pour la démo : 1 appel suffit à ouvrir le circuit.
resilience4j.circuitbreaker.instances.ms6CircuitBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.ms6CircuitBreaker.minimumNumberOfCalls=1
resilience4j.circuitbreaker.instances.ms6CircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ms6CircuitBreaker.waitDurationInOpenState=10s

# ------------------------------------------------------------------
# Portail Swagger unifié : http://localhost:8080/swagger-ui.html
# ------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=MS1 - Challenges
springdoc.swagger-ui.urls[0].url=/ms1/v3/api-docs
springdoc.swagger-ui.urls[1].name=MS2 - Participants
springdoc.swagger-ui.urls[1].url=/ms2/v3/api-docs
springdoc.swagger-ui.urls[2].name=MS3 - Soumissions
springdoc.swagger-ui.urls[2].url=/ms3/v3/api-docs
springdoc.swagger-ui.urls[3].name=MS4 - Evaluation
springdoc.swagger-ui.urls[3].url=/ms4/v3/api-docs
springdoc.swagger-ui.urls[4].name=MS5 - Verification
springdoc.swagger-ui.urls[4].url=/ms5/v3/api-docs
springdoc.swagger-ui.urls[5].name=MS6 - Reputation
springdoc.swagger-ui.urls[5].url=/ms6/v3/api-docs

# ------------------------------------------------------------------
# Supervision et traçabilité du routage (logs Eureka / rebondissement)
# ------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.info.env.enabled=true
info.app.name=API-Gateway
info.app.version=1.0.0
info.app.description=Point d'entree unique, routage Eureka et portail Swagger unique

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.tn.arene.gateway=DEBUG
logging.level.tn.arene.loadbalancer=DEBUG
