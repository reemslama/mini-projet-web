name: Postman API tests (all services)

# Local-only gates: no Postman account or POSTMAN_API_KEY is required.
# Run evidence stays in this job's log and in the uploaded YAML reports.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # MS4 uses the default datasource config: MySQL on 3306, root, empty password.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: forge_evaluation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Install into a writable prefix: `npm install -g` tries to symlink a man
      # page into /usr/local/share/man and fails on GitHub-hosted runners.
      - name: Install Postman CLI
        run: |
          echo "$RUNNER_TEMP/postman-cli/node_modules/.bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/postman-cli" --no-audit --no-fund postman-cli@1.94.0

      # Structural gate: fails the job on invalid v3 collection entities.
      # All six collections are also run live; MS2 targets the implemented
      # /api/users endpoints because its frozen contract paths do not exist.
      - name: Lint collections
        run: |
          for collection in \
            "postman/collections/MS1 Challenges" \
            "postman/collections/MS2 Participants" \
            "postman/collections/MS3 Soumissions" \
            "postman/collections/MS4 Evaluation" \
            "postman/collections/MS5 Verification" \
            "postman/collections/MS6 Reputation"; do
            postman collection lint "$collection" -f error
          done

      # Real services, no mocks: MS5 needs ~2s for its async worker before /logs.
      # Eureka is not started; the clients log warnings but serve HTTP normally.
      - name: Start MS1, MS2, MS3, MS4, MS5 and MS6
        run: |
          nohup sh -c 'cd Backend/ms1-challenges && mvn -q spring-boot:run' > /tmp/ms1.log 2>&1 &
          nohup sh -c 'cd Backend/ms2-participants && mvn -q spring-boot:run' > /tmp/ms2.log 2>&1 &
          nohup sh -c 'cd Backend/soumission && mvn -q spring-boot:run' > /tmp/ms3.log 2>&1 &
          nohup sh -c 'cd Backend/ms4-evaluation && mvn -q spring-boot:run' > /tmp/ms4.log 2>&1 &
          nohup sh -c 'cd Backend/ms5-verification && mvn -q spring-boot:run' > /tmp/ms5.log 2>&1 &
          nohup sh -c 'cd Backend/ms6-reputation && mvn -q spring-boot:run' > /tmp/ms6.log 2>&1 &
          for port in 8081 8082 8083 8084 8085 8086; do
            for i in $(seq 1 120); do
              if curl -fsS "http://localhost:$port/actuator/health" > /dev/null; then
                echo "service on $port is healthy"
                break
              fi
              if [ "$i" -eq 120 ]; then
                echo "service on $port did not become healthy"
                exit 1
              fi
              sleep 2
            done
          done

          # Fallback instances: start only after the primary is healthy so the
          # two Maven processes do not build the same source directory at once.
          nohup sh -c 'cd Backend/ms1-challenges && mvn -q spring-boot:run -Dspring-boot.run.arguments=--server.port=8091' > /tmp/ms1-fallback.log 2>&1 &
          nohup sh -c 'cd Backend/soumission && mvn -q spring-boot:run -Dspring-boot.run.arguments=--server.port=8093' > /tmp/ms3-fallback.log 2>&1 &
          nohup sh -c 'cd Backend/ms5-verification && mvn -q spring-boot:run -Dspring-boot.run.arguments=--server.port=8095' > /tmp/ms5-fallback.log 2>&1 &
          for port in 8091 8093 8095; do
            for i in $(seq 1 120); do
              if curl -fsS "http://localhost:$port/actuator/health" > /dev/null; then
                echo "fallback service on $port is healthy"
                break
              fi
              if [ "$i" -eq 120 ]; then
                echo "fallback service on $port did not become healthy"
                exit 1
              fi
              sleep 2
            done
          done

      # Behavioral gates. Exit codes are preserved: a failed pm.test fails the job.
      - name: Run MS1 collection
        run: |
          postman collection run "postman/collections/MS1 Challenges" \
            --delay-request 300 --no-report-events --output postman-reports/ms1

      - name: Run MS2 collection
        run: |
          postman collection run "postman/collections/MS2 Participants" \
            --delay-request 300 --no-report-events --output postman-reports/ms2

      - name: Run MS3 collection
        run: |
          postman collection run "postman/collections/MS3 Soumissions" \
            --delay-request 500 --no-report-events --output postman-reports/ms3

      - name: Run MS4 collection
        run: |
          postman collection run "postman/collections/MS4 Evaluation" \
            --delay-request 500 --no-report-events --output postman-reports/ms4

      - name: Run MS5 collection
        run: |
          postman collection run "postman/collections/MS5 Verification" \
            --delay-request 3000 --no-report-events --output postman-reports/ms5

      - name: Run MS6 collection
        run: |
          postman collection run "postman/collections/MS6 Reputation" \
            --delay-request 500 --no-report-events --output postman-reports/ms6

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-run-reports
          path: postman-reports/
          if-no-files-found: warn

      - name: Service logs on failure
        if: failure()
        run: |
          for service in ms1 ms2 ms3 ms4 ms5 ms6; do
            echo "=== $service ==="
            tail -n 200 "/tmp/$service.log" || true
          done
