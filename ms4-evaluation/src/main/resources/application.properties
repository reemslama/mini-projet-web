spring.application.name=ms4-evaluation
server.port=8084

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/forge_evaluation?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka1:8761/eureka/,http://eureka2:8762/eureka/

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Health Check Eureka
eureka.client.healthcheck.enabled=true

# Informations du microservice
management.info.env.enabled=true
info.app.name=MS4-Evaluation
info.app.version=1.0.0
info.app.description=Microservice de gestion des evaluations