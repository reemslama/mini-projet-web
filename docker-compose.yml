# En Lice — orchestration locale complète (S5+)
# Lancement : cp .env.example .env && docker compose up --build -d
name: enlice

networks:
  enlice-net:
    driver: bridge

volumes:
  mysql-data:
  pg-data:
  rabbit-data:

services:
  # ---------- Infrastructure ----------
  eureka:
    image: enlice/eureka:latest
    build: ./infra/eureka
    container_name: enlice-eureka
    ports: ["8761:8761"]
    environment:
      EUREKA_HOSTNAME: eureka
    networks: [enlice-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: enlice-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Le navigateur voit Keycloak sur localhost:8180 → l'issuer des jetons doit correspondre.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/realm-enlice.json:/opt/keycloak/data/import/realm-enlice.json:ro
    ports: ["8180:8080"]
    networks: [enlice-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: enlice-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-enlice}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-enlice}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Console d'administration
    networks: [enlice-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  mysql:
    image: mysql:8.4
    container_name: enlice-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: enlice_evaluation
      MYSQL_USER: enlice
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enlice}
    volumes: [mysql-data:/var/lib/mysql]
    ports: ["3306:3306"]
    networks: [enlice-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: enlice-postgres
    environment:
      POSTGRES_DB: enlice_verification
      POSTGRES_USER: enlice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enlice}
    volumes: [pg-data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    networks: [enlice-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enlice -d enlice_verification"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------- Passerelle ----------
  gateway:
    image: enlice/gateway:latest
    build: ./services/gateway
    container_name: enlice-gateway
    depends_on:
      eureka:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      EUREKA_URI: http://eureka:8761/eureka
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/enlice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/enlice/protocol/openid-connect/certs
    ports: ["8080:8080"]
    networks: [enlice-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s

  # ---------- Microservices ----------
  ms1-challenges:
    image: enlice/ms1-challenges:latest
    build: ./services/ms1-challenges
    container_name: enlice-ms1
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_URI: http://eureka:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-enlice}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enlice}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/enlice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/enlice/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8081:8081"]
    networks: [enlice-net]

  ms2-participants:
    image: enlice/ms2-participants:latest
    build: ./services/ms2-participants
    container_name: enlice-ms2
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_URI: http://eureka:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-enlice}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enlice}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/enlice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/enlice/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8082:8082"]
    networks: [enlice-net]

  ms3-submissions:
    image: enlice/ms3-submissions:latest
    build: ./services/ms3-submissions
    container_name: enlice-ms3
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_URI: http://eureka:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-enlice}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enlice}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/enlice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/enlice/protocol/openid-connect/certs
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      MS5_URL: http://ms5-verification:8085
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8083:8083"]
    networks: [enlice-net]

  ms4-evaluation:
    image: enlice/ms4-evaluation:latest
    build: ./services/ms4-evaluation
    container_name: enlice-ms4
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      EUREKA_URI: http://eureka:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-enlice}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enlice}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/enlice_evaluation
      SPRING_DATASOURCE_USERNAME: enlice
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-enlice}
      MS1_URL: http://ms1-challenges:8081
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/enlice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/enlice/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8084:8084"]
    networks: [enlice-net]

  ms5-verification:
    image: enlice/ms5-verification:latest
    build: ./services/ms5-verification
    container_name: enlice-ms5
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_URI: http://eureka:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-enlice}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enlice}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enlice_verification
      SPRING_DATASOURCE_USERNAME: enlice
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-enlice}
      MS1_URL: http://ms1-challenges:8081
      SANDBOX_ENABLED: "true"
      AI_ENABLED: "false"          # l'IA est optionnelle : la plateforme reste utilisable
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/enlice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/enlice/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8085:8085"]
    networks: [enlice-net]

  ms6-reputation:
    image: enlice/ms6-reputation:latest
    build: ./services/ms6-reputation
    container_name: enlice-ms6
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_URI: http://eureka:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-enlice}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enlice}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/enlice
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/enlice/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8086:8086"]
    networks: [enlice-net]

  # ---------- Frontend ----------
  frontend:
    image: enlice/frontend:latest
    build: ./frontend
    container_name: enlice-frontend
    depends_on:
      gateway:
        condition: service_healthy
    ports: ["3000:80"]
    networks: [enlice-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Mocks optionnels (profil "mocks") ----------
  # docker compose --profile mocks up -d wiremock
  # Puis MS3 avec GITHUB_API_BASE_URL=http://wiremock:8080
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: enlice-wiremock
    profiles: ["mocks"]
    volumes:
      - ./mocks/wiremock:/home/wiremock:ro
    ports: ["8090:8080"]
    networks: [enlice-net]
