$kind: http-request
description: |-
  Read the developer profile.
url: "{{baseUrl}}/api/developers/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: '{{developerId}}'
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('same developer', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('developerId')));
settings: {}
order: 2000
