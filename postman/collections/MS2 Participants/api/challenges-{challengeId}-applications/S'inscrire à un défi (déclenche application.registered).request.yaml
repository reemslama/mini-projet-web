$kind: http-request
description: |-
  Register the developer for a challenge.
url: "{{baseUrl}}/api/challenges/:challengeId/applications"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "applicantType": "DEVELOPER",
      "applicantId": "{{developerId}}"
    }
pathVariables:
  - key: challengeId
    value: '{{challengeId}}'
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      const application = pm.response.json();
      pm.collectionVariables.set('applicationId', application.id);
settings: {}
order: 5000
