$kind: http-request
description: |-
  List applications for the challenge.
url: "{{baseUrl}}/api/challenges/:challengeId/applications"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: challengeId
    value: '{{challengeId}}'
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('returns a list', () => pm.expect(pm.response.json()).to.be.an('array'));
settings: {}
order: 6000
