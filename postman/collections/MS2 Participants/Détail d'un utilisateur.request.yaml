$kind: http-request
description: |-
  Read the user created by the first request.
url: "{{baseUrl}}/api/users/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: '{{userId}}'
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const user = pm.response.json();
      pm.test('same user', () => pm.expect(user.id).to.eql(pm.collectionVariables.get('userId')));
      pm.test('competences preserved', () => pm.expect(user.competences).to.include('Java'));
settings: {}
order: 3000
