$kind: http-request
description: |-
  List the teams the created user belongs to (empty for a fresh profile).
url: "{{baseUrl}}/api/users/:id/teams"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: '{{userId}}'
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('returns a list', () => pm.expect(pm.response.json()).to.be.an('array'));
settings: {}
order: 5000
