$kind: http-request
name: Analyser la similarité d'une soumission vs les autres (pgvector)
description: ""
url: "{{baseUrl}}/api/similarity/analyze"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "submissionId": "{{submissionId}}",
      "challengeId": "{{challengeId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('report describes the submission', () => {
        const report = pm.response.json();
        pm.expect(report.submissionId).to.eql(pm.collectionVariables.get('submissionId'));
        pm.expect(report.matches).to.be.an('array');
      });
settings: {}
examples: ./.resources/Analyser la similarité d'une soumission vs les autres (pgvector.resources/examples
order: 1000
