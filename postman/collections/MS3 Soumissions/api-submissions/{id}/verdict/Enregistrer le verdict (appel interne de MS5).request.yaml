$kind: http-request
description: ""
url: "{{baseUrl}}/api/submissions/:id/verdict"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: '{{submissionId}}'
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "submissionId": "{{submissionId}}",
      "result": "PASS",
      "passed": 8,
      "failed": 2,
      "total": 10,
      "coverage": 87.5,
      "logsUrl": "https://ci.example.com/builds/42/logs",
      "verifiedAt": "2026-01-01T00:00:00Z"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('verdict PASS stored', () => pm.expect(pm.response.json().result).to.eql('PASS'));
settings: {}
examples: ./.resources/Enregistrer le verdict (appel interne de MS5).resources/examples
order: 1000
