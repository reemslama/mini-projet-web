$kind: http-request
description: |-
  Delete the expert created by this run.
url: "{{baseUrl}}/experts/delete/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: '{{expertId}}'
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
settings: {}
order: 5000
