$kind: http-request
description: |-
  Update the expert display name.
url: "{{baseUrl}}/experts/update/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "keycloakId": "postman-expert-1",
      "displayName": "Postman Expert Updated",
      "domains": [
        "java"
      ]
    }
pathVariables:
  - key: id
    value: '{{expertId}}'
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('displayName updated', () => pm.expect(pm.response.json().displayName).to.eql('Postman Expert Updated'));
settings: {}
order: 4000
