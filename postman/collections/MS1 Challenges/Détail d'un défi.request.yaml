$kind: http-request
description: |-
  Read the challenge created by the first request.
url: "{{baseUrl}}/api/challenges/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: '{{challengeId}}'
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('same challenge', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('challengeId')));
settings: {}
order: 3000
