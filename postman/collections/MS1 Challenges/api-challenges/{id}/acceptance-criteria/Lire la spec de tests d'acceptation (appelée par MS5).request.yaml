$kind: http-request
description: |-
  Read the acceptance criteria.
url: "{{baseUrl}}/api/challenges/:id/acceptance-criteria"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: '{{challengeId}}'
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('returns criteria', () => pm.expect(pm.response.json()).to.be.an('array'));
settings: {}
order: 7000
